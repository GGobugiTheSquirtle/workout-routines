<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>맨몸운동</title>
  <meta name="description" content="맨몸운동 루틴 관리 앱">
  <meta name="theme-color" content="#FAFAFA" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#09090B" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <!-- 인라인 favicon — 404 제거 // 2026-07-02 -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232563EB'/%3E%3Cpolygon points='26,20 48,32 26,44' fill='%23FFFFFF'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">

<style>
/* ==========================================================================
   VARIABLES — Refined Zinc/Blue Palette
   2026-04-06 — Palette upgrade: warm orange → clean blue, zinc neutrals
   ========================================================================== */

:root {
  /* Colors — Light (clean zinc undertone) */
  --bg-primary: #FAFAFA;
  --bg-secondary: #FFFFFF;
  --bg-tertiary: #F4F4F5;
  --text-primary: #18181B;
  --text-secondary: #71717A;
  --text-tertiary: #A1A1AA;
  --accent: #2563EB;
  --accent-hover: #1D4ED8;
  --accent-soft: #EFF6FF;
  --accent-muted: rgba(37, 99, 235, 0.10);
  --success: #059669;
  --success-soft: #ECFDF5;
  --warning: #D97706;
  --warning-soft: #FFFBEB;
  --border: #E4E4E7;
  --border-subtle: #F4F4F5;

  /* Shadows — zinc-tinted */
  --shadow-xs: 0 1px 2px rgba(24, 24, 27, 0.03);
  --shadow-sm: 0 1px 3px rgba(24, 24, 27, 0.04), 0 1px 2px rgba(24, 24, 27, 0.02);
  --shadow-md: 0 4px 12px rgba(24, 24, 27, 0.05), 0 2px 4px rgba(24, 24, 27, 0.03);
  --shadow-lg: 0 8px 24px rgba(24, 24, 27, 0.07), 0 4px 8px rgba(24, 24, 27, 0.03);
  --shadow-xl: 0 16px 40px rgba(24, 24, 27, 0.09), 0 6px 12px rgba(24, 24, 27, 0.04);

  /* Spacing — 4px grid */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-7: 28px;
  --space-8: 32px;
  --space-9: 36px;
  --space-10: 40px;
  --space-11: 44px;
  --space-12: 48px;
  --space-16: 64px;

  /* Typography */
  --font-sans: 'Pretendard Variable', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --text-xs: 0.75rem;
  --text-sm: 0.8125rem;
  --text-base: 0.9375rem;
  --text-lg: 1.0625rem;
  --text-xl: 1.25rem;
  --text-2xl: 1.5rem;
  --text-3xl: 1.875rem;
  --text-4xl: 2.25rem;
  --weight-normal: 400;
  --weight-medium: 500;
  --weight-semibold: 600;
  --weight-bold: 700;
  --weight-extrabold: 800;
  --leading-tight: 1.2;
  --leading-snug: 1.35;
  --leading-normal: 1.55;

  /* Radius */
  --radius-xs: 4px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-2xl: 24px;
  --radius-full: 9999px;

  /* Transitions */
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --duration-fast: 150ms;
  --duration-normal: 200ms;
  --duration-slow: 350ms;

  /* Layout */
  --tab-height: 68px;

  /* Glass */
  --glass-bg: rgba(250, 250, 250, 0.85);
  --glass-border: rgba(228, 228, 231, 0.6);
  --glass-blur: 16px;
}

/* ==========================================================================
   DARK MODE — Zinc dark
   2026-04-06 — Warm stone → zinc-950/900/800
   ========================================================================== */

@media (prefers-color-scheme: dark) {
  :root {
    --bg-primary: #09090B;
    --bg-secondary: #18181B;
    --bg-tertiary: #27272A;
    --text-primary: #FAFAFA;
    --text-secondary: #A1A1AA;
    --text-tertiary: #52525B;
    --accent: #3B82F6;
    --accent-hover: #2563EB;
    --accent-soft: #1E293B;
    --accent-muted: rgba(59, 130, 246, 0.15);
    --success: #34D399;
    --success-soft: #052E16;
    --warning: #FBBF24;
    --warning-soft: #422006;
    --border: #27272A;
    --border-subtle: #1F1F23;

    --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.18);
    --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.22), 0 1px 2px rgba(0, 0, 0, 0.16);
    --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.28), 0 2px 4px rgba(0, 0, 0, 0.18);
    --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.32), 0 4px 8px rgba(0, 0, 0, 0.22);
    --shadow-xl: 0 16px 40px rgba(0, 0, 0, 0.38), 0 6px 12px rgba(0, 0, 0, 0.24);

    --glass-bg: rgba(9, 9, 11, 0.85);
    --glass-border: rgba(255, 255, 255, 0.06);
    --glass-blur: 16px;
  }
}

/* ==========================================================================
   RESET / BASE
   ========================================================================== */

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  font-family: var(--font-sans);
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
  scroll-behavior: smooth;
}

body {
  background-color: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100dvh;
  min-height: 100vh;
  overflow-x: hidden;
  line-height: var(--leading-normal);
  letter-spacing: -0.01em;
}

/* Thin scrollbar — Webkit */
::-webkit-scrollbar {
  width: 4px;
}
::-webkit-scrollbar-track {
  background: transparent;
}
::-webkit-scrollbar-thumb {
  background: var(--border);
  border-radius: var(--radius-full);
}

/* ==========================================================================
   GRAIN OVERLAY — Premium texture
   ========================================================================== */

.grain-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  pointer-events: none;
  z-index: 9999;
  opacity: 0.015;
  mix-blend-mode: multiply;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
  background-repeat: repeat;
  background-size: 256px 256px;
}

@media (prefers-color-scheme: dark) {
  .grain-overlay {
    opacity: 0.015;
    mix-blend-mode: screen;
  }
}

/* ==========================================================================
   LAYOUT
   ========================================================================== */

#app {
  display: flex;
  flex-direction: column;
  min-height: 100dvh;
  min-height: 100vh;
}

#app-header {
  padding: var(--space-6) var(--space-6) var(--space-3);
  position: sticky;
  top: 0;
  background-color: var(--bg-primary);
  z-index: 10;
  transition: box-shadow var(--duration-normal) var(--ease-out);
}

/* 스크롤 시 헤더 구분 섀도 // 2026-07-02 */
#app-header.scrolled {
  box-shadow: var(--shadow-md);
}

.app-title {
  font-size: var(--text-3xl);
  font-weight: var(--weight-bold);
  letter-spacing: -0.035em;
  line-height: var(--leading-tight);
  color: var(--text-primary);
}

.header-subtitle {
  font-size: var(--text-sm);
  color: var(--text-secondary);
  margin-top: var(--space-1);
  letter-spacing: 0;
}

#main {
  flex: 1;
  padding: var(--space-2) var(--space-5) var(--space-4);
  padding-bottom: calc(var(--tab-height) + var(--space-6) + env(safe-area-inset-bottom, 0px));
}

/* ==========================================================================
   TAB CONTENT — Slide transitions
   ========================================================================== */

.tab-content {
  display: none;
}

.tab-content.active {
  display: block;
  animation: tabSlideIn var(--duration-slow) var(--ease-out);
}

/* ==========================================================================
   TAB BAR — Glassmorphism
   ========================================================================== */

#tab-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  width: 100%;
  height: var(--tab-height);
  background: var(--glass-bg);
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(150%);
  backdrop-filter: blur(var(--glass-blur)) saturate(150%);
  border-top: 1px solid var(--glass-border);
  display: flex;
  justify-content: space-around;
  align-items: center;
  padding-bottom: env(safe-area-inset-bottom, 0px);
  z-index: 100;
}

.tab-btn {
  background: none;
  border: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  padding: var(--space-2);
  color: var(--text-tertiary);
  font-family: var(--font-sans);
  font-size: 10px;
  font-weight: var(--weight-semibold);
  letter-spacing: 0.02em;
  min-width: 64px;
  min-height: 48px;
  cursor: pointer;
  position: relative;
  transition: color var(--duration-normal) var(--ease-out),
              transform var(--duration-fast) var(--ease-out);
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

.tab-btn:active {
  transform: scale(0.92);
}

.tab-btn.active {
  color: var(--accent);
}

/* Active tab indicator — small dot under icon */
.tab-btn.active::after {
  content: '';
  position: absolute;
  bottom: 4px;
  left: 50%;
  transform: translateX(-50%);
  width: 4px;
  height: 4px;
  border-radius: var(--radius-full);
  background-color: var(--accent);
  animation: dotPop var(--duration-normal) var(--ease-spring);
}

.tab-btn svg {
  width: 22px;
  height: 22px;
  flex-shrink: 0;
  transition: transform var(--duration-normal) var(--ease-out);
}

.tab-btn.active svg {
  transform: scale(1.08);
}

/* Desktop hover for tab buttons */
@media (hover: hover) {
  .tab-btn:hover {
    color: var(--text-primary);
  }
}

/* ==========================================================================
   LOADING — Skeleton (레이아웃 매칭 shimmer) // 2026-07-02
   ========================================================================== */

#loading {
  min-height: 100vh;
  min-height: 100dvh;
  max-width: 520px;
  margin: 0 auto;
  padding: var(--space-8) var(--space-5);
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
}

#loading.load-failed {
  align-items: center;
  justify-content: center;
  color: var(--text-secondary);
  font-size: var(--text-sm);
}

.skeleton-line {
  height: 14px;
  border-radius: var(--radius-sm);
  background: linear-gradient(90deg, var(--bg-tertiary) 25%, var(--border) 50%, var(--bg-tertiary) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.4s ease-in-out infinite;
}

.skeleton-line.lg {
  height: 28px;
  width: 40%;
  border-radius: var(--radius-md);
}

.skeleton-line.sm {
  width: 55%;
  margin-bottom: var(--space-4);
}

.skeleton-card {
  background: var(--bg-secondary);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: var(--space-5);
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
}

.skeleton-card .skeleton-line:nth-child(1) { width: 45%; }
.skeleton-card .skeleton-line:nth-child(2) { width: 70%; }
.skeleton-card .skeleton-line:nth-child(3) { width: 30%; }

/* ==========================================================================
   SETUP
   ========================================================================== */

.setup-card {
  max-width: 400px;
  margin: var(--space-16) auto;
  padding: var(--space-8);
  background-color: var(--bg-secondary);
  border-radius: var(--radius-2xl);
  box-shadow: var(--shadow-lg);
}

.setup-card h2 {
  font-size: var(--text-2xl);
  font-weight: var(--weight-bold);
  letter-spacing: -0.03em;
  margin-bottom: var(--space-3);
}

.setup-card p {
  color: var(--text-secondary);
  margin-bottom: var(--space-5);
  font-size: var(--text-sm);
  line-height: var(--leading-normal);
}

.setup-card .btn-primary {
  margin-top: var(--space-5);
  width: 100%;
}

.setup-card input {
  display: block;
  width: 100%;
  padding: var(--space-3) var(--space-4);
  border: 1.5px solid var(--border);
  border-radius: var(--radius-md);
  background-color: var(--bg-tertiary);
  color: var(--text-primary);
  font-family: var(--font-sans);
  font-size: var(--text-sm);
  outline: none;
  transition: border-color var(--duration-normal) var(--ease-out),
              box-shadow var(--duration-normal) var(--ease-out);
}

.setup-card input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-muted);
}

.setup-card input::placeholder {
  color: var(--text-tertiary);
}

/* ==========================================================================
   BUTTONS
   ========================================================================== */

.btn-primary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: var(--space-3) var(--space-5);
  background-color: var(--accent);
  color: #FFFFFF;
  font-family: var(--font-sans);
  font-size: var(--text-sm);
  font-weight: var(--weight-semibold);
  min-height: var(--space-12);
  border: none;
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: background-color var(--duration-fast) var(--ease-out),
              transform var(--duration-fast) var(--ease-out),
              box-shadow var(--duration-fast) var(--ease-out);
  -webkit-tap-highlight-color: transparent;
}

.btn-primary:active {
  background-color: var(--accent-hover);
  transform: scale(0.97);
  box-shadow: var(--shadow-xs);
}

@media (hover: hover) {
  .btn-primary:hover {
    background-color: var(--accent-hover);
    box-shadow: var(--shadow-md);
  }
}

/* Sequential progression controls // 2026-06-30 */
.day-advance {
  margin-top: var(--space-6);
  text-align: center;
}
.day-advance .btn-primary {
  width: 100%;
}
.day-advance .day-meta {
  margin-top: var(--space-3);
}
.btn-skip {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  padding: var(--space-3) var(--space-5);
  background-color: transparent;
  color: var(--text-secondary);
  font-family: var(--font-sans);
  font-size: var(--text-sm);
  font-weight: 600;
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  cursor: pointer;
  min-height: 44px;
}
.btn-skip:active { transform: scale(0.97); }

/* ==========================================================================
   ANIMATIONS
   ========================================================================== */

@keyframes tabSlideIn {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(4px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes timerSlideUp {
  from {
    opacity: 0;
    transform: translateY(12px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes toastIn {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes bannerPop {
  from {
    opacity: 0;
    transform: scale(0.95) translateY(6px);
  }
  to {
    opacity: 1;
    transform: scale(1) translateY(0);
  }
}

@keyframes dotPop {
  0% {
    transform: translateX(-50%) scale(0);
  }
  60% {
    transform: translateX(-50%) scale(1.4);
  }
  100% {
    transform: translateX(-50%) scale(1);
  }
}

@keyframes cardCascade {
  from {
    opacity: 0;
    transform: translateY(12px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes setCompletePulse {
  0% {
    transform: scale(1);
    box-shadow: 0 0 0 0 rgba(5, 150, 105, 0.4);
  }
  50% {
    transform: scale(1.15);
    box-shadow: 0 0 0 8px rgba(5, 150, 105, 0);
  }
  100% {
    transform: scale(1);
    box-shadow: 0 0 0 0 rgba(5, 150, 105, 0);
  }
}

@keyframes nowPulse {
  0%, 100% {
    opacity: 1;
  }
  50% {
    opacity: 0.6;
  }
}

@keyframes progressFill {
  from {
    width: 0;
  }
}

@keyframes shimmer {
  0% {
    background-position: -200% 0;
  }
  100% {
    background-position: 200% 0;
  }
}

@keyframes bannerGlow {
  0%, 100% {
    opacity: 0.8;
  }
  50% {
    opacity: 1;
  }
}

/* ==========================================================================
   RESPONSIVE
   ========================================================================== */

@media (min-width: 700px) {
  #main {
    max-width: 520px;
    margin: 0 auto;
  }
}

/* ==========================================================================
   TODAY TAB
   ========================================================================== */

.today-header {
  padding: var(--space-4) var(--space-2) var(--space-5);
}

.today-header h2 {
  font-size: var(--text-2xl);
  font-weight: var(--weight-bold);
  letter-spacing: -0.03em;
  line-height: var(--leading-tight);
}

.day-meta {
  font-size: var(--text-sm);
  color: var(--text-secondary);
  margin-top: var(--space-2);
  letter-spacing: 0;
}

.workout-list {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
  padding: 0 var(--space-1);
}

/* --- Workout Card --- */

.workout-card {
  background-color: var(--bg-secondary);
  border-radius: var(--radius-lg);
  padding: var(--space-5);
  border: 1px solid var(--border-subtle);
  transition: transform var(--duration-normal) var(--ease-out),
              box-shadow var(--duration-normal) var(--ease-out),
              opacity var(--duration-normal) var(--ease-out),
              border-color var(--duration-normal) var(--ease-out);
  animation: cardCascade var(--duration-slow) var(--ease-out) both;
  animation-delay: calc(var(--i, 0) * 40ms);
}

.workout-card.is-current {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent-soft);
}

.workout-card.is-done {
  opacity: 0.5;
}

.workout-card.is-pending {
  opacity: 0.65;
}

@media (hover: hover) {
  .workout-card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-lg);
  }
  .workout-card.is-done:hover,
  .workout-card.is-pending:hover {
    opacity: 0.85;
  }
}

.workout-card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: var(--space-2);
}

.workout-name {
  font-size: var(--text-base);
  font-weight: var(--weight-bold);
  color: var(--text-primary);
  cursor: pointer;
  letter-spacing: -0.02em;
  transition: color var(--duration-fast) var(--ease-out);
}

.workout-name:active {
  color: var(--accent);
}

@media (hover: hover) {
  .workout-name:hover {
    color: var(--accent);
  }
}

/* NOW badge — pulse animation */
.now-badge {
  font-size: 10px;
  font-weight: var(--weight-bold);
  color: var(--accent);
  background-color: var(--accent-soft);
  padding: 3px 10px;
  border-radius: var(--radius-full);
  letter-spacing: 0.06em;
  animation: nowPulse 2.5s ease-in-out infinite;
}

.done-badge {
  font-size: 10px;
  font-weight: var(--weight-bold);
  color: var(--success);
  background-color: var(--success-soft);
  padding: 3px 10px;
  border-radius: var(--radius-full);
  letter-spacing: 0.06em;
}

.workout-meta {
  font-size: var(--text-sm);
  color: var(--text-secondary);
  margin-bottom: var(--space-4);
  font-variant-numeric: tabular-nums;
}

/* --- Set Indicators (larger, 32px) --- */

.set-indicators {
  display: flex;
  gap: var(--space-2);
  align-items: center;
  margin-bottom: var(--space-4);
}

.set-dot {
  width: 32px;
  height: 32px;
  border-radius: var(--radius-full);
  border: 2px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: var(--text-xs);
  font-weight: var(--weight-semibold);
  font-variant-numeric: tabular-nums;
  color: var(--text-tertiary);
  transition: background-color var(--duration-normal) var(--ease-out),
              border-color var(--duration-normal) var(--ease-out),
              color var(--duration-normal) var(--ease-out),
              transform var(--duration-normal) var(--ease-spring);
}

.set-dot.done {
  background-color: var(--success);
  border-color: var(--success);
  color: #FFFFFF;
  animation: setCompletePulse 0.5s var(--ease-out);
}

.set-progress-text {
  font-size: var(--text-xs);
  font-weight: var(--weight-medium);
  color: var(--text-tertiary);
  margin-left: auto;
  font-variant-numeric: tabular-nums;
}

/* 세트 추가/삭제 — dot 행 끝의 점선 고스트 컨트롤 // 2026-07-03 */
.set-adjust {
  width: 32px;
  height: 32px;
  border-radius: var(--radius-full);
  border: 1.5px dashed var(--border);
  background: none;
  color: var(--text-tertiary);
  font-size: var(--text-lg);
  font-weight: var(--weight-bold);
  font-family: var(--font-sans);
  line-height: 1;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  -webkit-tap-highlight-color: transparent;
  transition: transform var(--duration-fast) var(--ease-out),
              border-color var(--duration-fast) var(--ease-out),
              color var(--duration-fast) var(--ease-out);
}

.set-adjust.remove {
  margin-left: var(--space-1);
}

.set-adjust:active:not(:disabled) {
  transform: scale(0.9);
  border-color: var(--accent);
  color: var(--accent);
}

.set-adjust:disabled {
  opacity: 0.3;
  cursor: default;
}

/* --- Reps Stepper — 실제 수행 횟수 기록 // 2026-07-02 --- */

.set-action-row {
  display: flex;
  gap: var(--space-2);
  align-items: stretch;
}

.reps-stepper {
  display: flex;
  align-items: center;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-md);
  background-color: var(--bg-tertiary);
  overflow: hidden;
}

.stepper-btn {
  width: var(--space-11);
  min-height: var(--space-12);
  border: none;
  background: none;
  color: var(--text-secondary);
  font-size: var(--text-lg);
  font-weight: var(--weight-bold);
  font-family: var(--font-sans);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background-color var(--duration-fast) var(--ease-out),
              color var(--duration-fast) var(--ease-out);
}

.stepper-btn:active {
  background-color: var(--border-subtle);
  color: var(--text-primary);
}

.reps-value {
  min-width: 44px;
  text-align: center;
  font-size: var(--text-base);
  font-weight: var(--weight-bold);
  font-variant-numeric: tabular-nums;
  color: var(--text-primary);
}

.set-action-row .btn-complete {
  width: auto;
  flex: 1;
}

/* --- Complete Button --- */

.btn-complete {
  width: 100%;
  padding: var(--space-4) var(--space-5);
  border: none;
  border-radius: var(--radius-md);
  background-color: var(--accent);
  color: #FFFFFF;
  font-size: var(--text-base);
  font-weight: var(--weight-bold);
  cursor: pointer;
  min-height: var(--space-12);
  font-family: var(--font-sans);
  letter-spacing: -0.01em;
  transition: background-color var(--duration-fast) var(--ease-out),
              transform var(--duration-fast) var(--ease-out),
              box-shadow var(--duration-fast) var(--ease-out);
  -webkit-tap-highlight-color: transparent;
}

.btn-complete:active {
  transform: scale(0.97);
  box-shadow: var(--shadow-xs);
  background-color: var(--accent-hover);
}

.btn-complete:disabled {
  background-color: var(--bg-tertiary);
  color: var(--text-tertiary);
  cursor: default;
  box-shadow: none;
}

.btn-complete.all-done {
  background: linear-gradient(135deg, var(--success) 0%, #10B981 100%);
}

@media (hover: hover) {
  .btn-complete:not(:disabled):hover {
    background-color: var(--accent-hover);
    box-shadow: var(--shadow-md);
  }
}

/* --- Note Input --- */

.note-input {
  width: 100%;
  margin-top: var(--space-3);
  padding: var(--space-3) var(--space-4);
  border: 1.5px solid var(--border);
  border-radius: var(--radius-md);
  background-color: var(--bg-tertiary);
  color: var(--text-primary);
  font-size: var(--text-sm);
  font-family: var(--font-sans);
  resize: none;
  transition: border-color var(--duration-normal) var(--ease-out),
              box-shadow var(--duration-normal) var(--ease-out);
}

.note-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-muted);
  outline: none;
}

.note-input::placeholder {
  color: var(--text-tertiary);
}

/* --- Rest Day --- */

.rest-day {
  text-align: center;
  padding: var(--space-16) var(--space-8);
  color: var(--text-secondary);
}

.rest-day-icon {
  display: block;
  font-size: 3.5rem;
  margin-bottom: var(--space-5);
  line-height: 1;
}

.rest-day h2 {
  font-size: var(--text-2xl);
  font-weight: var(--weight-bold);
  letter-spacing: -0.03em;
  margin-bottom: var(--space-3);
  color: var(--text-primary);
}

.rest-day p {
  font-size: var(--text-base);
  line-height: var(--leading-normal);
  color: var(--text-secondary);
  max-width: 260px;
  margin: 0 auto;
}

/* --- Complete Banner (gradient) --- */

.complete-banner {
  text-align: center;
  padding: var(--space-8) var(--space-6);
  background-color: var(--success-soft);
  border-radius: var(--radius-xl);
  margin: var(--space-4) var(--space-1);
  animation: bannerPop var(--duration-slow) var(--ease-spring) both; /* 2026-07-02 */
}

.complete-banner h3 {
  color: var(--success);
  font-size: var(--text-xl);
  font-weight: var(--weight-bold);
  letter-spacing: -0.02em;
  margin-bottom: var(--space-2);
}

.complete-banner p {
  color: var(--text-secondary);
  font-size: var(--text-sm);
}

/* ==========================================================================
   INLINE GUIDE (Today + Curriculum tabs) — 2026-04-07
   ========================================================================== */

.inline-guide-toggle {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: var(--space-2) 0;
  margin-top: var(--space-2);
  cursor: pointer;
  font-size: var(--text-xs);
  color: var(--text-tertiary);
  border-top: 1px solid var(--border-subtle);
  -webkit-tap-highlight-color: transparent;
}

.inline-guide-toggle .chevron {
  font-size: 10px;
  transition: transform var(--duration-fast) var(--ease-out);
}

.inline-guide-body {
  display: none;
  padding: var(--space-3) 0 0;
}

.inline-guide-body.open {
  display: block;
  animation: fadeIn var(--duration-fast) var(--ease-out);
}

.inline-guide-body.open + .inline-guide-toggle .chevron,
.inline-guide-toggle:has(+ .inline-guide-body.open) .chevron {
  transform: rotate(180deg);
}

.inline-guide-meta {
  font-size: var(--text-xs);
  color: var(--text-tertiary);
  margin-bottom: var(--space-2);
}

.inline-guide-section {
  margin-bottom: var(--space-3);
}

.inline-guide-label {
  font-size: var(--text-xs);
  font-weight: var(--weight-semibold);
  color: var(--accent);
  margin-bottom: var(--space-1);
}

.inline-guide-section ul {
  list-style: none;
  padding: 0;
}

.inline-guide-section li {
  font-size: var(--text-xs);
  color: var(--text-secondary);
  line-height: var(--leading-normal);
  padding-left: var(--space-3);
  position: relative;
  margin-bottom: 2px;
}

.inline-guide-section li::before {
  content: '·';
  position: absolute;
  left: var(--space-1);
  color: var(--text-tertiary);
}

.inline-guide-video {
  display: inline-flex;
  align-items: center;
  gap: var(--space-1);
  font-size: var(--text-xs);
  font-weight: var(--weight-semibold);
  color: var(--accent);
  text-decoration: none;
  padding: var(--space-1) 0;
}

.inline-guide-video:active {
  opacity: 0.7;
}

/* Curriculum exercise items with guide */
.level-exercise-item {
  border-bottom: 1px solid var(--border-subtle);
}

.level-exercise-item:last-child {
  border-bottom: none;
}

.level-exercise-item .level-exercise-row {
  cursor: pointer;
  border-bottom: none;
  -webkit-tap-highlight-color: transparent;
}

/* ==========================================================================
   GUIDE TAB
   ========================================================================== */

/* --- Filter Chips (more character) --- */

.guide-filters {
  display: flex;
  gap: var(--space-2);
  padding: var(--space-3) var(--space-2);
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}

.guide-filters::-webkit-scrollbar {
  display: none;
}

.filter-chip {
  padding: var(--space-2) var(--space-5);
  border-radius: var(--radius-full);
  border: 1.5px solid var(--border);
  background-color: var(--bg-secondary);
  color: var(--text-secondary);
  font-size: var(--text-sm);
  font-weight: var(--weight-semibold);
  font-family: var(--font-sans);
  cursor: pointer;
  white-space: nowrap;
  min-height: var(--space-11);
  transition: background-color var(--duration-normal) var(--ease-out),
              border-color var(--duration-normal) var(--ease-out),
              color var(--duration-normal) var(--ease-out),
              transform var(--duration-fast) var(--ease-out),
              box-shadow var(--duration-normal) var(--ease-out);
  -webkit-tap-highlight-color: transparent;
}

.filter-chip:active {
  transform: scale(0.96);
}

.filter-chip.active {
  background-color: var(--accent);
  border-color: var(--accent);
  color: #FFFFFF;
  box-shadow: 0 2px 8px rgba(37, 99, 235, 0.20);
}

@media (prefers-color-scheme: dark) {
  .filter-chip.active {
    box-shadow: 0 2px 8px rgba(59, 130, 246, 0.25);
  }
}

@media (hover: hover) {
  .filter-chip:not(.active):hover {
    border-color: var(--text-tertiary);
    color: var(--text-primary);
    background-color: var(--bg-tertiary);
  }
}

/* --- Guide List & Cards --- */

.guide-list {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  padding: 0 var(--space-1) var(--space-4);
}

.guide-card {
  background-color: var(--bg-secondary);
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
  transition: box-shadow var(--duration-normal) var(--ease-out),
              transform var(--duration-normal) var(--ease-out);
  animation: cardCascade var(--duration-slow) var(--ease-out) both;
  animation-delay: calc(var(--i, 0) * 40ms);
}

@media (hover: hover) {
  .guide-card:hover {
    box-shadow: var(--shadow-md);
    transform: translateY(-1px);
  }
}

.guide-card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: var(--space-4) var(--space-5);
  cursor: pointer;
  transition: background-color var(--duration-fast) var(--ease-out);
  -webkit-tap-highlight-color: transparent;
}

@media (hover: hover) {
  .guide-card-header:hover {
    background-color: var(--bg-tertiary);
  }
}

.guide-card-header h3 {
  font-size: var(--text-base);
  font-weight: var(--weight-bold);
  letter-spacing: -0.02em;
  margin-bottom: var(--space-1);
}

.guide-card-tags {
  display: flex;
  gap: var(--space-1);
  margin-top: var(--space-1);
}

.guide-tag {
  font-size: 10px;
  font-weight: var(--weight-semibold);
  padding: 2px 8px;
  border-radius: var(--radius-sm);
  background-color: var(--bg-tertiary);
  color: var(--text-secondary);
  letter-spacing: 0.02em;
}

.guide-card-body {
  padding: 0 var(--space-5) var(--space-5);
  display: none;
}

.guide-card.open .guide-card-body {
  display: block;
  animation: fadeIn var(--duration-normal) var(--ease-out);
}

/* Chevron SVG — smooth rotation */
.chevron {
  transition: transform var(--duration-normal) var(--ease-out);
  flex-shrink: 0;
  color: var(--text-tertiary);
}

.guide-card.open .chevron {
  transform: rotate(180deg);
}

/* Guide sections */
.guide-section {
  margin-bottom: var(--space-5);
}

.guide-section:last-child {
  margin-bottom: 0;
}

.guide-section-title {
  font-size: var(--text-sm);
  font-weight: var(--weight-bold);
  color: var(--accent);
  margin-bottom: var(--space-3);
  letter-spacing: -0.01em;
}

.guide-section p,
.guide-section li {
  font-size: var(--text-sm);
  color: var(--text-secondary);
  line-height: var(--leading-normal);
}

.guide-section ul {
  list-style: none;
  padding: 0;
}

.guide-section li {
  padding-left: var(--space-5);
  position: relative;
  margin-bottom: var(--space-2);
}

.guide-section li::before {
  content: '';
  position: absolute;
  left: var(--space-2);
  top: 9px;
  width: 5px;
  height: 5px;
  border-radius: var(--radius-full);
  background-color: var(--border);
}

.guide-progression {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  font-size: var(--text-sm);
  color: var(--text-secondary);
  flex-wrap: wrap;
}

.guide-progression .arrow {
  color: var(--accent);
  font-weight: var(--weight-bold);
}

.guide-progression .current {
  font-weight: var(--weight-bold);
  color: var(--accent);
}

.guide-video-link {
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  font-size: var(--text-sm);
  font-weight: var(--weight-semibold);
  color: var(--accent);
  text-decoration: none;
  transition: opacity var(--duration-fast) var(--ease-out);
}

.guide-video-link:active {
  opacity: 0.7;
}

/* ==========================================================================
   CURRICULUM TAB
   ========================================================================== */

.curriculum-header {
  padding: var(--space-4) var(--space-2) var(--space-5);
}

.curriculum-header h2 {
  font-size: var(--text-2xl);
  font-weight: var(--weight-bold);
  letter-spacing: -0.03em;
  line-height: var(--leading-tight);
}

.level-list {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
  padding: 0 var(--space-1) var(--space-4);
}

.level-card {
  background-color: var(--bg-secondary);
  border-radius: var(--radius-lg);
  overflow: hidden;
  border: 1px solid var(--border-subtle);
  transition: border-color var(--duration-normal) var(--ease-out),
              box-shadow var(--duration-normal) var(--ease-out),
              transform var(--duration-normal) var(--ease-out);
  animation: cardCascade var(--duration-slow) var(--ease-out) both;
  animation-delay: calc(var(--i, 0) * 40ms);
}

.level-card.is-current {
  border-color: var(--accent);
}

.level-card.is-locked {
  opacity: 0.35;
  pointer-events: none;
}

@media (hover: hover) {
  .level-card:not(.is-locked):hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-lg);
  }
}

.level-card-header {
  padding: var(--space-4) var(--space-5);
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
  transition: background-color var(--duration-fast) var(--ease-out);
  -webkit-tap-highlight-color: transparent;
}

@media (hover: hover) {
  .level-card-header:hover {
    background-color: var(--bg-tertiary);
  }
}

.level-title {
  font-size: var(--text-sm);
  font-weight: var(--weight-semibold);
  letter-spacing: -0.01em;
  color: var(--text-primary);
}

.level-badge {
  font-size: var(--text-xs);
  font-weight: var(--weight-medium);
  padding: 2px 8px;
  border-radius: var(--radius-sm);
  letter-spacing: 0;
}

.level-badge.current {
  background-color: var(--accent-soft);
  color: var(--accent);
}

.level-badge.locked {
  background: none;
  color: var(--text-tertiary);
}

.level-badge.completed {
  background: none;
  color: var(--success);
}

.level-card-body {
  padding: 0 var(--space-5) var(--space-5);
  display: none;
}

.level-card.open .level-card-body {
  display: block;
  animation: fadeIn var(--duration-normal) var(--ease-out);
}

.level-exercises {
  display: flex;
  flex-direction: column;
}

.level-exercise-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: var(--text-sm);
  padding: var(--space-3) 0;
  border-bottom: 1px solid var(--border-subtle);
  transition: background-color var(--duration-fast) var(--ease-out);
}

.level-exercise-row:last-child {
  border-bottom: none;
}

.level-exercise-cat {
  font-weight: var(--weight-medium);
  color: var(--text-tertiary);
  width: 48px;
  flex-shrink: 0;
  font-size: 11px;
  text-transform: lowercase;
  letter-spacing: 0;
}

.level-exercise-name {
  flex: 1;
  color: var(--text-primary);
}

.level-exercise-equip {
  color: var(--text-tertiary);
  font-size: var(--text-xs);
}

/* --- Progress Bar (thicker, gradient) --- */

.progress-bar-container {
  margin-top: var(--space-4);
  padding: var(--space-3) 0 0;
}

.progress-bar-label {
  font-size: var(--text-xs);
  font-weight: var(--weight-semibold);
  color: var(--text-secondary);
  margin-bottom: var(--space-2);
  font-variant-numeric: tabular-nums;
}

.progress-bar {
  height: 4px;
  background-color: var(--border-subtle);
  border-radius: var(--radius-full);
  overflow: hidden;
}

.progress-bar-fill {
  height: 100%;
  background: var(--accent);
  border-radius: var(--radius-full);
  transition: width var(--duration-slow) var(--ease-out);
}

/* --- Promotion Box --- */

.promotion-box {
  margin-top: var(--space-4);
  padding: var(--space-4);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  text-align: center;
}

.promotion-box p {
  font-size: var(--text-sm);
  color: var(--text-secondary);
  margin-bottom: var(--space-3);
}

.btn-levelup {
  padding: var(--space-2) var(--space-6);
  border: 1px solid var(--accent);
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--accent);
  font-size: var(--text-sm);
  font-weight: var(--weight-semibold);
  font-family: var(--font-sans);
  cursor: pointer;
  min-height: var(--space-10);
  letter-spacing: 0;
  transition: background-color var(--duration-fast) var(--ease-out),
              transform var(--duration-fast) var(--ease-out),
              box-shadow var(--duration-fast) var(--ease-out);
  -webkit-tap-highlight-color: transparent;
}

.btn-levelup:active {
  transform: scale(0.97);
  background-color: var(--accent-hover);
}

@media (hover: hover) {
  .btn-levelup:hover {
    background-color: var(--accent-hover);
    box-shadow: var(--shadow-md);
  }
}

/* ==========================================================================
   RECORDS TAB
   ========================================================================== */

.records-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: var(--space-4) var(--space-2) var(--space-5);
}

.records-header h2 {
  font-size: var(--text-2xl);
  font-weight: var(--weight-bold);
  letter-spacing: -0.03em;
}

.month-nav {
  display: flex;
  align-items: center;
  gap: var(--space-3);
}

.month-nav button {
  background: var(--bg-secondary);
  border: 1.5px solid var(--border);
  border-radius: var(--radius-full);
  width: var(--space-10);
  height: var(--space-10);
  cursor: pointer;
  color: var(--text-secondary);
  font-size: var(--text-base);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-sans);
  transition: background-color var(--duration-fast) var(--ease-out),
              border-color var(--duration-fast) var(--ease-out),
              transform var(--duration-fast) var(--ease-out);
  -webkit-tap-highlight-color: transparent;
}

.month-nav button:active {
  transform: scale(0.92);
  background-color: var(--bg-tertiary);
}

@media (hover: hover) {
  .month-nav button:hover {
    background-color: var(--bg-tertiary);
    border-color: var(--text-tertiary);
  }
}

.month-nav span {
  font-size: var(--text-base);
  font-weight: var(--weight-bold);
  min-width: 100px;
  text-align: center;
  font-variant-numeric: tabular-nums;
}

/* --- Mini Calendar (rounded, clearer states) --- */

.mini-calendar {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 3px;
  padding: 0 var(--space-2) var(--space-5);
}

.mini-calendar .day-name {
  text-align: center;
  font-size: 10px;
  font-weight: var(--weight-bold);
  color: var(--text-tertiary);
  padding: var(--space-2) 0;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.day-cell {
  text-align: center;
  padding: var(--space-2);
  border-radius: var(--radius-sm);
  font-size: var(--text-sm);
  font-weight: var(--weight-medium);
  font-variant-numeric: tabular-nums;
  cursor: pointer;
  min-height: var(--space-10);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  color: var(--text-primary);
  transition: background-color var(--duration-fast) var(--ease-out),
              color var(--duration-fast) var(--ease-out),
              transform var(--duration-fast) var(--ease-out);
  -webkit-tap-highlight-color: transparent;
}

.day-cell:active:not(.empty) {
  transform: scale(0.92);
}

.day-cell.empty {
  cursor: default;
}

.day-cell.today {
  font-weight: var(--weight-extrabold);
  color: var(--accent);
  background-color: var(--accent-muted);
  border-radius: var(--radius-sm);
}

.day-cell.selected {
  background-color: var(--accent);
  color: #FFFFFF;
  border-radius: var(--radius-sm);
  font-weight: var(--weight-bold);
  box-shadow: 0 2px 6px rgba(37, 99, 235, 0.25);
}

@media (prefers-color-scheme: dark) {
  .day-cell.selected {
    box-shadow: 0 2px 6px rgba(59, 130, 246, 0.30);
  }
}

.day-cell.has-workout::after {
  content: '';
  display: block;
  width: 5px;
  height: 5px;
  border-radius: var(--radius-full);
  background-color: var(--accent);
}

.day-cell.selected.has-workout::after {
  background-color: #FFFFFF;
}

@media (hover: hover) {
  .day-cell:not(.empty):not(.selected):hover {
    background-color: var(--bg-tertiary);
  }
}

/* --- Journal --- */

.journal-section {
  padding: var(--space-4) var(--space-2);
}

.journal-date {
  font-size: var(--text-lg);
  font-weight: var(--weight-bold);
  letter-spacing: -0.02em;
  margin-bottom: var(--space-4);
}

.journal-day-label {
  font-size: var(--text-sm);
  color: var(--text-secondary);
  margin-bottom: var(--space-4);
}

.journal-empty {
  color: var(--text-tertiary);
  font-size: var(--text-sm);
  text-align: center;
  padding: var(--space-8) 0;
}

.journal-exercise {
  background-color: var(--bg-secondary);
  border-radius: var(--radius-md);
  padding: var(--space-4) var(--space-5);
  margin-bottom: var(--space-3);
  box-shadow: var(--shadow-sm);
}

.journal-exercise-name {
  font-weight: var(--weight-bold);
  font-size: var(--text-sm);
  margin-bottom: var(--space-3);
  letter-spacing: -0.01em;
}

.journal-set-row {
  display: flex;
  justify-content: space-between;
  font-size: var(--text-sm);
  color: var(--text-secondary);
  padding: var(--space-1) 0;
  font-variant-numeric: tabular-nums;
}

.journal-note {
  font-size: var(--text-xs);
  color: var(--accent);
  margin-top: var(--space-2);
  font-weight: var(--weight-medium);
}

.journal-summary {
  padding: var(--space-4) var(--space-5);
  background-color: var(--bg-tertiary);
  border-radius: var(--radius-md);
  margin-top: var(--space-4);
  font-size: var(--text-sm);
  font-weight: var(--weight-semibold);
  color: var(--text-secondary);
  font-variant-numeric: tabular-nums;
  box-shadow: var(--shadow-xs);
}

/* ==========================================================================
   SESSION PROGRESS + LAST RECORD (Today tab) // 2026-07-02
   ========================================================================== */

.session-progress {
  margin-top: var(--space-3);
  height: 4px;
  background-color: var(--border-subtle);
  border-radius: var(--radius-full);
  overflow: hidden;
}

.session-progress-fill {
  height: 100%;
  background: var(--accent);
  border-radius: var(--radius-full);
  transition: width var(--duration-slow) var(--ease-out);
}

.last-record {
  font-size: var(--text-xs);
  color: var(--text-tertiary);
  margin: calc(-1 * var(--space-3)) 0 var(--space-4);
  font-variant-numeric: tabular-nums;
}

/* ==========================================================================
   REST TIMER — 세트 완료 시 자동 시작 // 2026-07-02
   ========================================================================== */

#rest-timer {
  position: fixed;
  left: var(--space-4);
  right: var(--space-4);
  bottom: calc(var(--tab-height) + env(safe-area-inset-bottom, 0px) + var(--space-3));
  display: none;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-3) var(--space-4);
  background-color: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-xl);
  z-index: 110;
}

#rest-timer.visible {
  display: flex;
  animation: timerSlideUp var(--duration-normal) var(--ease-out);
}

@media (min-width: 700px) {
  #rest-timer {
    max-width: 488px;
    left: 50%;
    right: auto;
    width: calc(100% - 32px);
    transform: translateX(-50%);
  }
}

.rest-timer-info {
  display: flex;
  flex-direction: column;
  min-width: 52px;
}

.rest-timer-label {
  font-size: 10px;
  font-weight: var(--weight-bold);
  color: var(--text-tertiary);
  letter-spacing: 0.06em;
}

.rest-timer-time {
  font-size: var(--text-xl);
  font-weight: var(--weight-extrabold);
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
  line-height: 1.1;
  color: var(--text-primary);
}

.rest-timer-track {
  flex: 1;
  height: 4px;
  background-color: var(--border-subtle);
  border-radius: var(--radius-full);
  overflow: hidden;
}

.rest-timer-fill {
  height: 100%;
  width: 100%;
  background: var(--accent);
  border-radius: var(--radius-full);
  transition: width 0.2s linear;
}

.rest-timer-btn {
  padding: var(--space-2) var(--space-3);
  min-height: var(--space-11);
  border-radius: var(--radius-md);
  border: 1px solid var(--border);
  background-color: var(--bg-tertiary);
  color: var(--text-primary);
  font-family: var(--font-sans);
  font-size: var(--text-xs);
  font-weight: var(--weight-semibold);
  cursor: pointer;
  white-space: nowrap;
  -webkit-tap-highlight-color: transparent;
  transition: transform var(--duration-fast) var(--ease-out);
}

.rest-timer-btn:active {
  transform: scale(0.96);
}

.rest-timer-btn.skip {
  background-color: transparent;
  color: var(--text-secondary);
}

/* ==========================================================================
   TOAST — alert() 대체 + 실행 취소 // 2026-07-02
   ========================================================================== */

#toast-container {
  position: fixed;
  left: var(--space-4);
  right: var(--space-4);
  bottom: calc(var(--tab-height) + env(safe-area-inset-bottom, 0px) + 80px);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--space-2);
  z-index: 120;
  pointer-events: none;
}

.toast {
  pointer-events: auto;
  display: inline-flex;
  align-items: center;
  gap: var(--space-3);
  max-width: 100%;
  padding: var(--space-3) var(--space-5);
  background-color: var(--text-primary);
  color: var(--bg-primary);
  border-radius: var(--radius-full);
  box-shadow: var(--shadow-lg);
  font-size: var(--text-sm);
  font-weight: var(--weight-medium);
  animation: toastIn var(--duration-normal) var(--ease-out);
  transition: opacity var(--duration-normal) var(--ease-out),
              transform var(--duration-normal) var(--ease-out);
}

.toast.hide {
  opacity: 0;
  transform: translateY(8px);
}

.toast-action {
  border: none;
  background: none;
  padding: var(--space-1) 0;
  color: #93C5FD;
  font-family: var(--font-sans);
  font-size: var(--text-sm);
  font-weight: var(--weight-bold);
  cursor: pointer;
  white-space: nowrap;
  -webkit-tap-highlight-color: transparent;
}

@media (prefers-color-scheme: dark) {
  .toast-action {
    color: #2563EB;
  }
}

/* ==========================================================================
   REDUCED MOTION — 접근성 // 2026-07-02
   ========================================================================== */

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
  html {
    scroll-behavior: auto;
  }
}

/* ==========================================================================
   UTILITY CLASSES
   ========================================================================== */

.text-muted {
  color: var(--text-tertiary);
}

.error-msg {
  color: var(--warning);
  font-weight: var(--weight-semibold);
}

.mt-4 {
  margin-top: var(--space-4);
}

</style>
</head>
<body>

<!-- Premium grain overlay -->
<div class="grain-overlay" aria-hidden="true"></div>

<!-- ======================================================================
     LOADING OVERLAY
     ====================================================================== -->
<!-- 스켈레톤 로딩 — 레이아웃 매칭 shimmer // 2026-07-02 -->
<div id="loading" aria-busy="true">
  <div class="skeleton-line lg"></div>
  <div class="skeleton-line sm"></div>
  <div class="skeleton-card"><div class="skeleton-line"></div><div class="skeleton-line"></div><div class="skeleton-line"></div></div>
  <div class="skeleton-card"><div class="skeleton-line"></div><div class="skeleton-line"></div><div class="skeleton-line"></div></div>
  <div class="skeleton-card"><div class="skeleton-line"></div><div class="skeleton-line"></div><div class="skeleton-line"></div></div>
</div>

<!-- ======================================================================
     MAIN APP (hidden initially)
     ====================================================================== -->
<div id="app" style="display:none">

  <header id="app-header">
    <h1 class="app-title">맨몸운동</h1>
    <span id="header-subtitle" class="header-subtitle"></span>
  </header>

  <main id="main">
    <section id="tab-today" class="tab-content active"></section>
    <section id="tab-curriculum" class="tab-content"></section>
    <section id="tab-records" class="tab-content"></section>
    <section id="tab-guide" class="tab-content"></section>
  </main>

  <nav id="tab-bar">
    <!-- today: play/circle icon -->
    <button class="tab-btn active" data-tab="today">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>

    <!-- curriculum: list icon -->
    <button class="tab-btn" data-tab="curriculum">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="8" y1="6" x2="21" y2="6"/>
        <line x1="8" y1="12" x2="21" y2="12"/>
        <line x1="8" y1="18" x2="21" y2="18"/>
        <circle cx="4" cy="6" r="1" fill="currentColor"/>
        <circle cx="4" cy="12" r="1" fill="currentColor"/>
        <circle cx="4" cy="18" r="1" fill="currentColor"/>
      </svg>
      <span>커리큘럼</span>
    </button>
    <!-- records: calendar icon -->
    <button class="tab-btn" data-tab="records">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
        <line x1="16" y1="2" x2="16" y2="6"/>
        <line x1="8" y1="2" x2="8" y2="6"/>
        <line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
      <span>기록</span>
    </button>
    <!-- guide: book-open icon -->
    <button class="tab-btn" data-tab="guide">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
        <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>

  <!-- 휴식 타이머 — 세트 완료 시 자동 시작 // 2026-07-02 -->
  <div id="rest-timer" aria-live="polite">
    <div class="rest-timer-info">
      <span class="rest-timer-label">휴식</span>
      <span id="rest-timer-time" class="rest-timer-time">0:00</span>
    </div>
    <div class="rest-timer-track"><div id="rest-timer-fill" class="rest-timer-fill"></div></div>
    <button class="rest-timer-btn" onclick="extendRestTimer(30)">+30초</button>
    <button class="rest-timer-btn skip" onclick="endRestTimer(false)">건너뛰기</button>
  </div>

  <!-- 토스트 컨테이너 // 2026-07-02 -->
  <div id="toast-container" aria-live="polite"></div>

</div>

<!-- ======================================================================
     JAVASCRIPT
     ====================================================================== -->
<script>
/* ==========================================================================
   STATE
   ========================================================================== */

const state = {
  exercises: [],
  todayProgram: [],
  config: {},
  logs: [],
  logsHistory: [], // 전월 포함 로그 — "지난번" 기록 표시용 // 2026-07-02
  programs: [],
  today: '',
  currentSeq: null,
  totalDays: null,
  isRest: false,
  nextLabel: '',
  activeTab: 'today',
  sessionProgress: {},
  exerciseMap: {},
  guideFilter: '전체',
  guideScrollTo: null,
  recordsMonth: null,
  recordsDate: null
};

/* ==========================================================================
   API CLIENT
   ========================================================================== */

const API_URL = localStorage.getItem('sheets_url') || 'https://script.google.com/macros/s/AKfycby_0_keb2239-sOTSJTZXhXFW-7tgX6fa9_QrXI20zRxPTQ4Ht19yPi5qnteG8FMk2-/exec';

const api = {
  async init() {
    const res = await fetch(API_URL + '?action=init');
    return res.json();
  },
  async getPrograms(month) {
    const res = await fetch(API_URL + '?action=programs&month=' + month);
    return res.json();
  },
  async getLogs(month) {
    const res = await fetch(API_URL + '?action=logs&month=' + month);
    return res.json();
  },
  async getExercises() {
    const res = await fetch(API_URL + '?action=exercises');
    return res.json();
  },
  async postLog(data) {
    const res = await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'log', ...data })
    });
    return res.json();
  },
  async postConfig(key, value) {
    const res = await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'config', key, value })
    });
    return res.json();
  }
};

/* ==========================================================================
   TAB ROUTER
   ========================================================================== */

function switchTab(tabName) {
  state.activeTab = tabName;
  document.querySelectorAll('.tab-content').forEach(function(el) {
    el.classList.remove('active');
  });
  document.querySelectorAll('.tab-btn').forEach(function(el) {
    el.classList.remove('active');
  });
  document.getElementById('tab-' + tabName).classList.add('active');
  document.querySelector('[data-tab="' + tabName + '"]').classList.add('active');
  window.location.hash = '/' + tabName;
  renderTab(tabName);
}

document.getElementById('tab-bar').addEventListener('click', function(e) {
  var btn = e.target.closest('.tab-btn');
  if (btn) switchTab(btn.dataset.tab);
});

function handleHash() {
  var hash = window.location.hash.replace('#/', '') || 'today';
  if (['today', 'curriculum', 'records', 'guide'].includes(hash)) {
    switchTab(hash);
  }
}

window.addEventListener('hashchange', handleHash);

function renderTab(name) {
  switch (name) {
    case 'today': renderToday(); break;
    case 'curriculum': renderCurriculum(); break;
    case 'records': renderRecords(); break;
    case 'guide': renderGuide(); break;
  }
}

/* ==========================================================================
   RENDERERS
   ========================================================================== */

function renderToday() {
  var container = document.getElementById('tab-today');
  var program = state.todayProgram;

  var seqMode = state.currentSeq != null;
  var dayCounter = seqMode ? ('Day ' + state.currentSeq + ' / ' + state.totalDays) : formatDateKR(state.today);

  // Rest day check (seq 모드: is_rest 플래그 / 레거시: 빈 프로그램)
  if (state.isRest || !program || program.length === 0) {
    var rhtml = '<div class="rest-day"><span class="rest-day-icon">&#127769;</span><h2>휴식일</h2>';
    rhtml += '<p>충분히 쉬세요. 회복도 성장의 일부입니다.</p>';
    if (seqMode) {
      rhtml += '<div class="day-meta">' + dayCounter + (state.nextLabel ? ' · 다음: ' + state.nextLabel : '') + '</div>';
      rhtml += '<button class="btn-primary mt-4" onclick="advanceDay()">휴식 완료 — 다음 일정으로 &rarr;</button>';
    }
    rhtml += '</div>';
    container.innerHTML = rhtml;
    return;
  }

  var dayLabel = program[0].day_label || '';
  var dateStr = dayCounter;

  // All done check
  var allDone = program.every(function(p) {
    var prog = state.sessionProgress[p.exercise_id];
    return prog && prog.every(Boolean);
  });

  // 세션 세트 진행률 // 2026-07-02
  var totalSets = 0, doneSets = 0;
  program.forEach(function(p) {
    var prog = state.sessionProgress[p.exercise_id] || [];
    totalSets += prog.length;
    doneSets += prog.filter(Boolean).length;
  });

  var html = '<div class="today-header"><h2>' + dayLabel + '</h2>';
  html += '<div class="day-meta">Level ' + (state.config.current_level || 1) + ' · ' + dateStr + (totalSets ? ' · 세트 ' + doneSets + '/' + totalSets : '') + '</div>';
  if (totalSets) {
    html += '<div class="session-progress"><div class="session-progress-fill" style="width:' + Math.round(doneSets / totalSets * 100) + '%"></div></div>';
  }
  html += '</div>';

  if (allDone) {
    html += '<div class="complete-banner"><h3>오늘 운동 완료!</h3><p>수고했어요. 기록이 저장되었습니다.</p></div>';
  }

  html += '<div class="workout-list">';

  // Find current exercise (first with incomplete sets)
  var currentIdx = currentExerciseIdx();

  program.forEach(function(p, idx) {
    var ex = state.exerciseMap[p.exercise_id] || {};
    var progress = state.sessionProgress[p.exercise_id] || [];
    var doneCount = progress.filter(Boolean).length;
    var totalSets = progress.length;
    var isDone = doneCount === totalSets;
    var isCurrent = idx === currentIdx;
    var statusClass = isDone ? 'is-done' : isCurrent ? 'is-current' : 'is-pending';

    html += '<div class="workout-card ' + statusClass + '" style="--i:' + idx + '">';
    html += '<div class="workout-card-header">';
    html += '<span class="workout-name" onclick="navigateToGuide(\'' + p.exercise_id + '\')">' + (idx + 1) + '. ' + (ex.name || p.exercise_id) + '</span>';
    if (isCurrent) html += '<span class="now-badge">NOW</span>';
    if (isDone) html += '<span class="done-badge">DONE</span>';
    html += '</div>';
    html += '<div class="workout-meta">' + p.sets + '×' + p.reps + ' · ' + (ex.muscles_primary || '') + '</div>';

    // 지난 세션 기록 — 점진적 과부하 참고용 // 2026-07-02
    var last = lastSessionInfo(p.exercise_id);
    if (last) {
      html += '<div class="last-record">지난번 ' + last.label + ' · ' + last.reps.join(' · ') + '</div>';
    }

    // Set indicators
    html += '<div class="set-indicators">';
    progress.forEach(function(done, si) {
      html += '<div class="set-dot ' + (done ? 'done' : '') + '">' + (done ? '✓' : (si + 1)) + '</div>';
    });
    // 세트 추가/삭제 — 현재 운동 카드에서만 (완료 세트 삭제 불가) // 2026-07-03
    if (isCurrent) {
      var canRemove = totalSets > 1 && totalSets > doneCount;
      html += '<button class="set-adjust remove" onclick="adjustSets(\'' + p.exercise_id + '\', -1)"' + (canRemove ? '' : ' disabled') + ' aria-label="세트 삭제">−</button>';
      html += '<button class="set-adjust add" onclick="adjustSets(\'' + p.exercise_id + '\', 1)" aria-label="세트 추가">+</button>';
    }
    html += '<span class="set-progress-text">' + doneCount + '/' + totalSets + '</span></div>';

    // Complete button + reps stepper + note (only for current exercise) // 2026-07-02
    if (isCurrent) {
      var repsInfo = parseReps(p.reps);
      html += '<div class="set-action-row">';
      if (repsInfo) {
        html += '<div class="reps-stepper">';
        html += '<button class="stepper-btn" onclick="stepReps(\'' + p.exercise_id + '\', -1)" aria-label="횟수 줄이기">−</button>';
        html += '<span class="reps-value" id="reps-' + p.exercise_id + '" data-step="' + repsInfo.step + '" data-unit="' + repsInfo.unit + '">' + repsInfo.value + repsInfo.unit + '</span>';
        html += '<button class="stepper-btn" onclick="stepReps(\'' + p.exercise_id + '\', 1)" aria-label="횟수 늘리기">+</button>';
        html += '</div>';
      }
      html += '<button class="btn-complete" onclick="completeSet(\'' + p.exercise_id + '\')">세트 ' + (doneCount + 1) + ' 완료</button>';
      html += '</div>';
      html += '<textarea class="note-input" placeholder="메모 (선택)" rows="1" id="note-' + p.exercise_id + '"></textarea>';
    }

    // Inline guide (collapsible) // 2026-04-07
    html += '<div class="inline-guide-toggle" onclick="toggleInlineGuide(\'' + p.exercise_id + '-today\')">';
    html += '<span>가이드 보기</span><span class="chevron">▼</span></div>';
    html += '<div class="inline-guide-body" id="guide-inline-' + p.exercise_id + '-today">';
    if (ex.form_guide) {
      html += '<div class="inline-guide-section"><div class="inline-guide-label">폼 가이드</div>';
      html += '<ul>' + ex.form_guide.split('\n').filter(Boolean).map(function(l) { return '<li>' + l.trim() + '</li>'; }).join('') + '</ul></div>';
    }
    if (ex.common_mistakes) {
      html += '<div class="inline-guide-section"><div class="inline-guide-label">흔한 실수</div>';
      html += '<ul>' + ex.common_mistakes.split('\n').filter(Boolean).map(function(l) { return '<li>' + l.trim() + '</li>'; }).join('') + '</ul></div>';
    }
    if (ex.safety_notes) {
      html += '<div class="inline-guide-section"><div class="inline-guide-label">안전 주의</div>';
      html += '<ul>' + ex.safety_notes.split('\n').filter(Boolean).map(function(l) { return '<li>' + l.trim() + '</li>'; }).join('') + '</ul></div>';
    }
    if (ex.video_url) {
      html += '<a href="' + ex.video_url + '" target="_blank" rel="noopener noreferrer" class="inline-guide-video">&#9654; 영상 보기</a>';
    }
    html += '</div>';

    html += '</div>';
  });

  html += '</div>';

  // Sequential progression controls // 2026-06-30
  if (state.currentSeq != null) {
    html += '<div class="day-advance">';
    if (allDone) {
      html += '<button class="btn-primary" onclick="advanceDay()">완료 — 다음 일정으로 &rarr;</button>';
    } else {
      html += '<button class="btn-skip" onclick="advanceDay()">건너뛰고 다음 일정으로 &rarr;</button>';
    }
    if (state.nextLabel) html += '<div class="day-meta">다음: ' + state.nextLabel + '</div>';

// 다음 일정으로 진행 — current_seq 커서를 +1 (완료/건너뛰기 공통). 날짜와 무관, 스킵해도 순서 유지. // 2026-06-30
async function advanceDay() {
  if (state.currentSeq == null) return;
  flushPendingLog(); // 미저장 세트 확정 후 진행 // 2026-07-02
  if (state.totalDays != null && state.currentSeq >= state.totalDays) {
    showToast('프로그램의 마지막 일정입니다. 수고하셨습니다!');
    return;
  }
  var next = state.currentSeq + 1;
  try {
    await api.postConfig('current_seq', next);
  } catch (err) {
    console.error('Advance failed:', err);
    showToast('다음 일정 저장 실패 — 네트워크를 확인하세요');
    return;
  }
  // 새 커서로 깨끗하게 재로드 (세션 진행상태 초기화 포함)
  location.reload();
}

// reps 파싱 — "8"(횟수) 또는 "20초"(시간)만 스테퍼 지원, 그 외 null // 2026-07-02
function parseReps(reps) {
  var m = String(reps == null ? '' : reps).trim().match(/^(\d+)(초)?$/);
  if (!m) return null;
  var unit = m[2] || '';
  return { value: Number(m[1]), unit: unit, step: unit === '초' ? 5 : 1 };
}

// 세트 추가/삭제 — 세션 상태만 조작 (완료 세트는 로그 전송됨 → 삭제 불가) // 2026-07-03
function adjustSets(exId, delta) {
  var progress = state.sessionProgress[exId];
  if (!progress) return;
  var doneCount = progress.filter(Boolean).length;
  if (delta > 0) {
    if (progress.length >= 10) return; // 레이아웃 상한
    progress.push(false);
  } else {
    // 완료 세트는 항상 앞쪽 prefix → 마지막 세트 pop = 미완료 세트 제거. 최소 1개 유지.
    if (progress.length <= 1 || progress.length <= doneCount) return;
    progress.pop();
  }
  vibrate(8);
  // 세트 트리밍으로 운동/세션이 완료 상태가 될 수 있음 → wake lock 재평가
  if (sessionActive()) acquireWakeLockIfActive(); else releaseWakeLock();
  renderToday();
}

// 스테퍼 증감 — 횟수 ±1, 시간 ±5초 // 2026-07-02
function stepReps(exId, dir) {
  var el = document.getElementById('reps-' + exId);
  if (!el) return;
  var step = Number(el.dataset.step) || 1;
  var cur = parseInt(el.textContent, 10) || 0;
  var next = Math.max(0, cur + dir * step);
  el.textContent = next + (el.dataset.unit || '');
  vibrate(8);
}

// 첫 미완료 운동 index // 2026-07-02
function currentExerciseIdx() {
  return state.todayProgram.findIndex(function(p) {
    var prog = state.sessionProgress[p.exercise_id];
    return prog && prog.some(function(s) { return !s; });
  });
}

// 직전 세션 기록 (전월 포함 logsHistory 기준) // 2026-07-02
function lastSessionInfo(exId) {
  var prior = (state.logsHistory || []).filter(function(l) {
    return l.exercise_id === exId && l.date && l.date < state.today;
  });
  if (!prior.length) return null;
  var lastDate = prior.reduce(function(m, l) { return l.date > m ? l.date : m; }, '');
  var sets = prior.filter(function(l) { return l.date === lastDate; });
  sets.sort(function(a, b) { return (Number(a.set_number) || 0) - (Number(b.set_number) || 0); });
  var d = new Date(lastDate + 'T00:00:00');
  return {
    label: (d.getMonth() + 1) + '/' + d.getDate(),
    reps: sets.map(function(s) { return s.reps_done || '-'; })
  };
}

// 2026-07-02 — 세트 완료: undo 5초 창 후 POST, 휴식 타이머 자동 시작, 햅틱
function completeSet(exerciseId) {
  var progress = state.sessionProgress[exerciseId];
  var setIdx = progress.findIndex(function(s) { return !s; });
  if (setIdx === -1) return;

  flushPendingLog(); // 직전 세트 pending 확정
  primeAudio();      // 사용자 제스처 시점에 AudioContext 준비 (타이머 비프용)
  vibrate(15);

  progress[setIdx] = true;

  var noteEl = document.getElementById('note-' + exerciseId);
  var note = noteEl ? noteEl.value.trim() : '';
  var programEntry = state.todayProgram.find(function(p) { return p.exercise_id === exerciseId; }) || {};

  // 스테퍼 값 우선 (실제 수행 횟수), 없으면 목표값 // 2026-07-02
  var repsEl = document.getElementById('reps-' + exerciseId);
  var payload = {
    date: state.today,
    exercise_id: exerciseId,
    set_number: setIdx + 1,
    reps_done: repsEl ? repsEl.textContent : (programEntry.reps || ''),
    note: note
  };

  // 기록 탭 즉시 반영용 로컬 push (undo 시 제거)
  var localLog = { date: payload.date, exercise_id: exerciseId, set_number: payload.set_number, reps_done: payload.reps_done, note: note };
  state.logs.push(localLog);
  state.logsHistory.push(localLog);

  var prevIdx = currentExerciseIdx();

  var pending = { payload: payload, exerciseId: exerciseId, setIdx: setIdx, localLog: localLog };
  pending.timeoutId = setTimeout(function() { flushPendingLog(); }, 5000);
  pendingLog = pending;

  var allDone = state.todayProgram.every(function(pp) {
    var prog = state.sessionProgress[pp.exercise_id];
    return prog && prog.every(Boolean);
  });

  if (allDone) {
    endRestTimer(false);
    vibrate([30, 60, 30, 60, 80]);
    releaseWakeLock();
  } else {
    startRestTimer(programEntry.rest_sec);
  }

  renderToday();

  pending.dismissToast = showToast('세트 ' + (setIdx + 1) + ' 완료', {
    actionLabel: '실행 취소',
    onAction: function() { undoSet(pending); }
  });

  // 다음 운동으로 넘어갔으면 해당 카드로 스크롤
  var newIdx = currentExerciseIdx();
  if (newIdx !== -1 && newIdx !== prevIdx) scrollToCurrentCard();
}

// 세트 실행 취소 — pending 상태에서만 가능 // 2026-07-02
function undoSet(pending) {
  if (pendingLog !== pending) return; // 이미 저장 확정된 세트는 무시
  pendingLog = null;
  clearTimeout(pending.timeoutId);
  var progress = state.sessionProgress[pending.exerciseId];
  if (progress) progress[pending.setIdx] = false;
  var li = state.logs.indexOf(pending.localLog);
  if (li !== -1) state.logs.splice(li, 1);
  var hi = state.logsHistory.indexOf(pending.localLog);
  if (hi !== -1) state.logsHistory.splice(hi, 1);
  endRestTimer(false);
  acquireWakeLockIfActive(); // allDone 상태가 되돌려졌을 수 있음
  renderToday();
}

/* --- Pending log (undo 창) --- // 2026-07-02 */

var pendingLog = null;

function flushPendingLog(useBeacon) {
  if (!pendingLog) return;
  var p = pendingLog;
  pendingLog = null;
  clearTimeout(p.timeoutId);
  if (p.dismissToast) p.dismissToast();
  if (useBeacon && navigator.sendBeacon) {
    navigator.sendBeacon(API_URL, JSON.stringify(Object.assign({ action: 'log' }, p.payload)));
  } else {
    api.postLog(p.payload).catch(function(err) { console.error('Log post failed:', err); });
  }
}

// 페이지 이탈 시 미저장 세트 유실 방지
window.addEventListener('pagehide', function() { flushPendingLog(true); });

/* --- Rest Timer --- // 2026-07-02 */

var restTimer = { deadline: 0, total: 0, interval: null };

function startRestTimer(sec) {
  sec = Number(sec) > 0 ? Number(sec) : 60;
  restTimer.total = sec;
  restTimer.deadline = Date.now() + sec * 1000;
  document.getElementById('rest-timer').classList.add('visible');
  clearInterval(restTimer.interval);
  restTimer.interval = setInterval(tickRestTimer, 200);
  tickRestTimer();
}

function tickRestTimer() {
  var remainMs = restTimer.deadline - Date.now();
  var remain = Math.max(0, Math.ceil(remainMs / 1000));
  document.getElementById('rest-timer-time').textContent = Math.floor(remain / 60) + ':' + String(remain % 60).padStart(2, '0');
  var pct = restTimer.total > 0 ? Math.max(0, remainMs / (restTimer.total * 1000)) : 0;
  document.getElementById('rest-timer-fill').style.width = (pct * 100) + '%';
  if (remainMs <= 0) endRestTimer(true);
}

function endRestTimer(notify) {
  clearInterval(restTimer.interval);
  restTimer.interval = null;
  document.getElementById('rest-timer').classList.remove('visible');
  if (notify) {
    vibrate([150, 80, 150]);
    playBeep();
  }
}

function extendRestTimer(sec) {
  restTimer.deadline += sec * 1000;
  restTimer.total += sec;
  tickRestTimer();
}

/* --- Toast --- // 2026-07-02 */

function showToast(msg, opts) {
  opts = opts || {};
  var container = document.getElementById('toast-container');
  var t = document.createElement('div');
  t.className = 'toast';
  var span = document.createElement('span');
  span.textContent = msg;
  t.appendChild(span);
  if (opts.actionLabel) {
    var btn = document.createElement('button');
    btn.className = 'toast-action';
    btn.textContent = opts.actionLabel;
    btn.onclick = function() {
      dismiss();
      if (opts.onAction) opts.onAction();
    };
    t.appendChild(btn);
  }
  container.appendChild(t);
  var hideTimer = setTimeout(dismiss, opts.duration || (opts.actionLabel ? 5000 : 2800));
  function dismiss() {
    clearTimeout(hideTimer);
    if (!t.parentNode) return;
    t.classList.add('hide');
    setTimeout(function() { t.remove(); }, 250);
  }
  return dismiss;
}

/* --- Haptics + Beep --- // 2026-07-02 */

function vibrate(pattern) {
  if (navigator.vibrate) { try { navigator.vibrate(pattern); } catch (e) {} }
}

var audioCtx = null;

function primeAudio() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch (e) {}
}

function playBeep() {
  if (!audioCtx) return;
  try {
    [0, 0.18].forEach(function(offset) {
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.frequency.value = 880;
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      var now = audioCtx.currentTime + offset;
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.12, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.14);
      osc.start(now);
      osc.stop(now + 0.15);
    });
  } catch (e) {}
}

/* --- Wake Lock — 운동 중 화면 꺼짐 방지 --- // 2026-07-02 */

var wakeLock = null;

function sessionActive() {
  if (state.isRest || !state.todayProgram.length) return false;
  return currentExerciseIdx() !== -1;
}

function acquireWakeLockIfActive() {
  if (!('wakeLock' in navigator)) return;
  if (!sessionActive() || document.visibilityState !== 'visible') return;
  navigator.wakeLock.request('screen').then(function(lock) { wakeLock = lock; }).catch(function() {});
}

function releaseWakeLock() {
  if (wakeLock) {
    wakeLock.release().catch(function() {});
    wakeLock = null;
  }
}

document.addEventListener('visibilitychange', function() {
  if (document.visibilityState === 'visible') acquireWakeLockIfActive();
});

function renderCurriculum() {

  (state.exercises || []).forEach(function(ex) {

  html += '<div class="day-meta">현재 Level ' + currentLevel + ' · ' + (levelNames[currentLevel] || '') + '</div></div>';
  html += '<div class="level-list">';

  for (var lv = 1; lv <= 5; lv++) {
    var isCurrent = lv === currentLevel;

    var statusClass = isCurrent ? ' is-current' : isLocked ? ' is-locked' : '';
    var openClass = isCurrent ? ' open' : '';
    var badgeClass = isCurrent ? 'current' : isLocked ? 'locked' : 'completed';
    var badgeLabel = isCurrent ? '진행중' : isLocked ? '잠금' : '완료';

    html += '<div class="level-card' + statusClass + openClass + '" id="level-' + lv + '" style="--i:' + (lv - 1) + '">';

    // Card header
    html += '<div class="level-card-header" onclick="toggleLevelCard(' + lv + ')">';
    html += '<span class="level-title">Level ' + lv + ' — ' + (levelNames[lv] || '') + '</span>';
    html += '<span class="level-badge ' + badgeClass + '">' + badgeLabel + '</span>';
    html += '</div>';

    // Card body
    html += '<div class="level-card-body">';
    html += '<div class="level-exercises">';

    var exercises = levelGroups[lv] || [];
    // Sort by category order
    exercises.sort(function(a, b) {
      var ai = catOrder.indexOf(a.category);
      var bi = catOrder.indexOf(b.category);
      if (ai === -1) ai = catOrder.length;
      if (bi === -1) bi = catOrder.length;
      return ai - bi;
    });

    exercises.forEach(function(ex) {
      html += '<div class="level-exercise-item">';
      html += '<div class="level-exercise-row" onclick="toggleInlineGuide(\'' + ex.id + '-cur\')">';
      html += '<span class="level-exercise-cat">' + (ex.category || '') + '</span>';
      html += '<span class="level-exercise-name">' + (ex.name || ex.id) + '</span>';
      html += '<span class="chevron" style="font-size:10px;color:var(--text-tertiary)">▼</span>';
      html += '</div>';
      // Inline guide (collapsible) // 2026-04-07
      html += '<div class="inline-guide-body" id="guide-inline-' + ex.id + '-cur">';
      html += '<div class="inline-guide-meta">' + (ex.equipment || '맨몸') + ' · ' + (ex.muscles_primary || '') + '</div>';
      if (ex.form_guide) {
        html += '<div class="inline-guide-section"><div class="inline-guide-label">폼 가이드</div>';
        html += '<ul>' + ex.form_guide.split('\n').filter(Boolean).map(function(l) { return '<li>' + l.trim() + '</li>'; }).join('') + '</ul></div>';
      }
      if (ex.video_url) {
        html += '<a href="' + ex.video_url + '" target="_blank" rel="noopener noreferrer" class="inline-guide-video">&#9654; 영상 보기</a>';
      }
      html += '</div>';
      html += '</div>';
    });

    html += '</div>'; // .level-exercises

    // Progress bar for current level
    if (isCurrent) {
      var pct = calculateLevelProgress(lv);

      html += '<div class="progress-bar"><div class="progress-bar-fill" style="width:' + pct + '%"></div></div>';
      html += '</div>';

      // Promotion box if >= 80%
      if (pct >= 80) {

        html += '<p>진급 준비가 되었을 수 있어요!</p>';
        html += '<button class="btn-levelup" onclick="levelUp()">Level ' + (lv + 1) + ' 진급</button>';

// # 2026-04-04
function calculateLevelProgress(level) {
  var levelExercises = state.exercises.filter(function(ex) { return Number(ex.level) === level; });
  if (levelExercises.length === 0) return 0;
  var completed = 0;
  levelExercises.forEach(function(ex) {
    var logs = (state.logs || []).filter(function(l) { return l.exercise_id === ex.id; });
    var sessions = new Set(logs.map(function(l) { return l.date; })).size;
    if (sessions >= 3) completed++;
  });
  return Math.round((completed / levelExercises.length) * 100);
}

// # 2026-04-04
function renderMiniCalendar(year, month) {
  var dayNames = ['일', '월', '화', '수', '목', '금', '토'];
  var firstDay = new Date(year, month - 1, 1).getDay();
  var daysInMonth = new Date(year, month, 0).getDate();

  var datesWithLogs = new Set((state.logs || []).map(function(l) { return l.date; }));

  var html = '<div class="mini-calendar">';

  // Day name header row
  dayNames.forEach(function(d) {
    html += '<div class="day-name">' + d + '</div>';
  });

  // Empty cells before first day
  for (var e = 0; e < firstDay; e++) {
    html += '<div class="day-cell empty"></div>';
  }

  // Day cells
  for (var d = 1; d <= daysInMonth; d++) {
    var dateStr = year + '-' + String(month).padStart(2, '0') + '-' + String(d).padStart(2, '0');
    var classes = ['day-cell'];
    if (dateStr === state.today) classes.push('today');
    if (dateStr === state.recordsDate) classes.push('selected');
    if (datesWithLogs.has(dateStr)) classes.push('has-workout');

    html += '<div class="' + classes.join(' ') + '" onclick="selectDate(\'' + dateStr + '\')">' + d + '</div>';
  }

  html += '</div>';
  return html;
}

// # 2026-04-04
function renderJournal(dateStr) {
  var html = '<div class="journal-section">';
  html += '<div class="journal-date">' + (dateStr ? formatDateKR(dateStr) : '') + '</div>';

  var dayLogs = (state.logs || []).filter(function(l) { return l.date === dateStr; });

  if (dayLogs.length === 0) {
    html += '<div class="journal-empty">이 날의 기록이 없습니다.</div>';
    html += '</div>';
    return html;
  }

  // Find day_label from programs
  var dayPrograms = (state.programs || []).filter(function(p) { return p.date === dateStr; });
  if (dayPrograms.length > 0 && dayPrograms[0].day_label) {
    html += '<div class="journal-day-label">' + dayPrograms[0].day_label + '</div>';
  }

  // Group logs by exercise_id
  var grouped = {};
  dayLogs.forEach(function(l) {
    if (!grouped[l.exercise_id]) grouped[l.exercise_id] = [];
    grouped[l.exercise_id].push(l);
  });

  // Build planned reps lookup: { exercise_id: reps }
  var plannedReps = {};
  dayPrograms.forEach(function(p) {
    plannedReps[p.exercise_id] = p.reps;
  });

  var totalVolume = 0;

  Object.keys(grouped).forEach(function(exId) {
    var sets = grouped[exId];
    var ex = state.exerciseMap[exId] || {};
    var exName = ex.name || exId;
    var planned = plannedReps[exId];

    html += '<div class="journal-exercise">';
    html += '<div class="journal-exercise-name">' + exName + '</div>';

    sets.forEach(function(s, i) {
      var repsDone = s.reps_done || '-';
      var repNum = parseInt(repsDone, 10);
      if (!isNaN(repNum)) totalVolume += repNum;

      var setLabel = '세트 ' + (s.set_number || (i + 1));
      var repsLabel = repsDone + '회';
      if (planned) repsLabel += ' <span class="text-muted">(목표: ' + planned + ')</span>';

      html += '<div class="journal-set-row"><span>' + setLabel + '</span><span>' + repsLabel + '</span></div>';

      if (s.note) {
        html += '<div class="journal-note">' + s.note + '</div>';
      }
    });

    html += '</div>';
  });

  // Summary
  var exerciseCount = Object.keys(grouped).length;
  var setCount = dayLogs.length;
  html += '<div class="journal-summary">';
  html += exerciseCount + '종목 · ' + setCount + '세트 · 총 ' + totalVolume + '회';
  html += '</div>';

  html += '</div>';
  return html;
}

// # 2026-04-04
async function changeMonth(delta) {
  var parts = state.recordsMonth.split('-').map(Number);
  var newMonth = parts[1] + delta;
  var newYear = parts[0];
  if (newMonth < 1) { newMonth = 12; newYear--; }
  if (newMonth > 12) { newMonth = 1; newYear++; }
  state.recordsMonth = newYear + '-' + String(newMonth).padStart(2, '0');
  state.recordsDate = null;
  try {
    var data = await api.getLogs(state.recordsMonth);
    if (data.logs) state.logs = data.logs;
    var pData = await api.getPrograms(state.recordsMonth);
    if (pData.programs) state.programs = pData.programs;
  } catch (err) { console.error('Failed to fetch month data:', err); }
  renderRecords();
}
